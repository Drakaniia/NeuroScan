<section>
<h2>Figure 2-1. Conceptual framework of the NeuroScan screening system</h2>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1110" width="1160" height="1110" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Conceptual framework of the NeuroScan screening system</title>
  <desc id="figDesc">Three bands stack top to bottom inside a dashed system boundary. The input band holds three boxes: the brain MRI image as one 2D slice per screening unit, the trained CNN model embedded in the application, and the intended user and setting, a clinician or health worker in a resource-limited setting. The process band holds four boxes executed locally: preprocessing that resizes and normalizes the image, CNN classification in a single forward pass, confidence computation giving the probability of each class, and class activation mapping that localizes the regions behind the prediction. The output band holds six boxes: the verdict of tumor present or no tumor, the confidence score, the heatmap overlay, batch results for every image in the selected folder, the screening history, and exports as a CSV summary with annotated images. A single arrow from the output band crosses the system boundary to clinician review and triage decision, marked as decision support only and not a diagnosis.</desc>

<section>
<h2>Figure 3-2. System architecture of NeuroScan</h2>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" width="1160" height="900" role="img" aria-labelledby="f35title f35desc">
  <title id="f35title">System architecture of NeuroScan</title>
  <desc id="f35desc">Above: the development-time offline Python pipeline, a chain of download and verify, deduplicate and split, train and evaluate, and export to ONNX. In the middle band, the exported artifacts form the interface between the two sides: the ONNX model exposing logits, feature map, head weights and head bias, together with the run configuration holding input size, normalization constants, class order and the screening threshold. Below: the run-time Tauri desktop application with a React and TypeScript frontend, the Rust command layer, the inference core using ONNX Runtime, the bundled resources, and the history and export store, with no network connection at run time.</desc>

  <defs>
    <marker id="a35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>

<section>
<h2>Figure 3-3. Flowchart of the screening process</h2>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1400" width="1160" height="1400" role="img" aria-labelledby="f36title f36desc">
  <title id="f36title">Screening workflow of NeuroScan for a single image</title>
  <desc id="f36desc">Flowchart. The selected image is decoded, resized and normalized. If decoding fails, a per-file error is recorded, the batch continues, and the next image is taken. Otherwise a single ONNX forward pass returns logits, the feature map and the head weights. Softmax gives the probability p, which is compared with the threshold tau read from the run configuration, producing one of three verdicts: tumor, no tumor, or manual review when p lies within 0.05 of tau. A class activation map is computed from the same pass. If that map is uniform, the overlay is skipped and the source image is shown uncolored. The probability, verdict, confidence band and processing time are displayed and logged, an optional export is offered, and the workflow moves to the next image or ends the batch.</desc>

  <defs>
    <marker id="a36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .ct  { font: 700 24px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1e293b; }
      .d   { font: 400 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #475569; }
      .n   { font: italic 400 21px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #64748b; }
      .yn  { font: 700 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1160" height="1400" fill="#ffffff"/>

  <rect x="80" y="60" width="500" height="80" rx="40" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text class="ct" x="330" y="110" text-anchor="middle">Image selected &#8212; single or batch</text>

  <g>
    <rect x="80" y="175" width="500" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="ct" x="330" y="217" text-anchor="middle">Decode, resize, normalize</text>
    <text class="n" x="330" y="247" text-anchor="middle">grayscale to RGB; EXIF applied</text>
  </g>

  <polygon points="150,355 330,295 510,355 330,415" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text class="ct" x="330" y="363" text-anchor="middle">Decoded?</text>

  <g>
    <rect x="80" y="450" width="500" height="90" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text class="ct" x="330" y="492" text-anchor="middle">One ONNX forward pass</text>
    <text class="n" x="330" y="522" text-anchor="middle">logits, feature map, head weights</text>
  </g>

  <g>
    <rect x="80" y="575" width="500" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="ct" x="330" y="617" text-anchor="middle">Softmax &#8594; p; compare with &#964;</text>
    <text class="n" x="330" y="647" text-anchor="middle">threshold from run-config</text>
  </g>

  <g>
    <rect x="80" y="700" width="500" height="140" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="2.4"/>
    <rect x="80" y="700" width="9" height="140" rx="4" fill="#d97706" opacity="0.75"/>
    <text class="ct" x="104" y="740">Verdict</text>
    <text class="d" x="104" y="776">p &#8805; &#964; &#8594; tumor</text>
    <text class="d" x="104" y="804">|p &#8722; &#964;| &#8804; 0.05 &#8594; manual review</text>
    <text class="d" x="104" y="832">p &lt; &#964; &#8594; no tumor</text>
  </g>

  <g>
    <rect x="80" y="875" width="500" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="ct" x="330" y="917" text-anchor="middle">CAM from the same pass</text>
    <text class="n" x="330" y="947" text-anchor="middle">features &#215; head_w, composited</text>
  </g>

  <polygon points="150,1060 330,1000 510,1060 330,1120" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text class="ct" x="330" y="1068" text-anchor="middle">Heatmap uniform?</text>

  <g>
    <rect x="80" y="1155" width="500" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="ct" x="330" y="1197" text-anchor="middle">Display and log the result</text>
    <text class="n" x="330" y="1227" text-anchor="middle">export CSV and PNGs on request</text>
  </g>

  <rect x="80" y="1280" width="500" height="80" rx="40" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text class="ct" x="330" y="1330" text-anchor="middle">Next image, or end of batch</text>

  <!-- error branch -->
  <g>
    <rect x="660" y="290" width="480" height="130" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2.4"/>
    <text class="ct" x="684" y="336">Per-file error</text>
    <text class="n" x="684" y="372">Recorded as an error row;</text>
    <text class="n" x="684" y="402">the batch is not aborted</text>
  </g>
  <path d="M 330 415 V 450" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <text class="yn" x="352" y="438">Yes</text>
  <path d="M 510 355 H 660" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <text class="yn" x="585" y="345" text-anchor="middle">No</text>
  <path d="M 1140 355 H 1152 V 100 H 580" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="8 7" fill="none" marker-end="url(#a36)"/>
  <text class="n" x="866" y="90" text-anchor="middle">next image</text>

  <!-- uniform heatmap branch -->
  <g>
    <rect x="660" y="995" width="480" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.4"/>
    <text class="ct" x="684" y="1041">Uniform heatmap</text>
    <text class="n" x="684" y="1077">Overlay skipped and the</text>
    <text class="n" x="684" y="1107">source shown uncolored</text>
  </g>
  <path d="M 330 1120 V 1155" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <text class="yn" x="352" y="1143">No</text>
  <path d="M 510 1060 H 660" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <text class="yn" x="585" y="1050" text-anchor="middle">Yes</text>
  <path d="M 900 1125 V 1200 H 580" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="8 7" fill="none" marker-end="url(#a36)"/>
  <text class="n" x="900" y="1250" text-anchor="middle">continue</text>

  <path d="M 330 265 V 295" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <path d="M 330 540 V 575" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <path d="M 330 665 V 700" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <path d="M 330 840 V 875" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>
  <path d="M 330 965 V 1000" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a36)"/>

  <text class="n" x="580" y="1382" text-anchor="middle">Every step after the forward pass reuses that single pass.</text>
</svg>
</section>
<section>
<h2>Figure 3-4. Block diagram of the convolutional network</h2>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" width="1160" height="850" role="img" aria-labelledby="f34title f34desc">
  <title id="f34title">Block diagram of the convolutional network</title>
  <desc id="f34desc">Top band, feature extraction: the input tensor, the stem, and the four residual stages of ResNet-18, ending at a 512 by 7 by 7 feature map. An arrow carries 512 features down to the second band, the classification head, which runs left to right through global average pooling, dropout, the two-class linear layer and the class scores. Two tensors leave the network for the heatmap: the feature map from the last stage and the 2 by 512 head weight matrix from the linear layer, both entering the class activation map box below, which composites the result over the source image.</desc>

  <defs>
    <marker id="a34" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .ct  { font: 700 24px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1e293b; }
      .d   { font: 400 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #475569; }
      .n   { font: italic 400 21px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #64748b; }
      .lbl { font: 700 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1160" height="850" fill="#ffffff"/>

  <!-- ============ feature extraction ============ -->
  <rect x="20" y="70" width="1120" height="230" rx="14" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="11 8"/>
  <rect x="36" y="58" width="540" height="30" fill="#ffffff"/>
  <text class="lbl" x="38" y="78">Feature extraction &#8212; one forward pass</text>

  <g>
    <rect x="29" y="100" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text class="ct" x="112" y="142" text-anchor="middle">Input</text>
    <text class="n" x="112" y="176" text-anchor="middle">3 &#215; 224 &#215; 224</text>
    <text class="n" x="112" y="204" text-anchor="middle">normalized</text>
  </g>
  <g>
    <rect x="216" y="100" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text class="ct" x="299" y="142" text-anchor="middle">Stem</text>
    <text class="n" x="299" y="176" text-anchor="middle">7 &#215; 7 conv, 64</text>
    <text class="n" x="299" y="204" text-anchor="middle">64 &#215; 56 &#215; 56</text>
  </g>
  <g>
    <rect x="403" y="100" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text class="ct" x="486" y="142" text-anchor="middle">Stage 1</text>
    <text class="n" x="486" y="176" text-anchor="middle">2 blocks &#215; 64</text>
    <text class="n" x="486" y="204" text-anchor="middle">64 &#215; 56 &#215; 56</text>
  </g>
  <g>
    <rect x="590" y="100" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text class="ct" x="673" y="142" text-anchor="middle">Stage 2</text>
    <text class="n" x="673" y="176" text-anchor="middle">2 blocks &#215; 128</text>
    <text class="n" x="673" y="204" text-anchor="middle">128 &#215; 28 &#215; 28</text>
  </g>
  <g>
    <rect x="777" y="100" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text class="ct" x="860" y="142" text-anchor="middle">Stage 3</text>
    <text class="n" x="860" y="176" text-anchor="middle">2 blocks &#215; 256</text>
    <text class="n" x="860" y="204" text-anchor="middle">256 &#215; 14 &#215; 14</text>
  </g>
  <g>
    <rect x="964" y="100" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text class="ct" x="1047" y="142" text-anchor="middle">Stage 4</text>
    <text class="n" x="1047" y="176" text-anchor="middle">2 blocks &#215; 512</text>
    <text class="n" x="1047" y="204" text-anchor="middle">512 &#215; 7 &#215; 7</text>
  </g>

  <path d="M 195 170 H 216" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>
  <path d="M 382 170 H 403" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>
  <path d="M 569 170 H 590" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>
  <path d="M 756 170 H 777" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>
  <path d="M 943 170 H 964" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>

  <text class="n" x="30" y="278">ResNet-18, ImageNet-1k weights &#183; 11.2 M parameters</text>

  <!-- ============ classification head ============ -->
  <rect x="20" y="370" width="920" height="180" rx="14" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="11 8"/>
  <rect x="300" y="358" width="300" height="30" fill="#ffffff"/>
  <text class="lbl" x="302" y="378">Classification head</text>

  <g>
    <rect x="30" y="400" width="190" height="120" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <text class="ct" x="125" y="430" text-anchor="middle">Global average</text>
    <text class="ct" x="125" y="458" text-anchor="middle">pooling</text>
    <text class="n" x="125" y="496" text-anchor="middle">512 features</text>
  </g>
  <g>
    <rect x="260" y="400" width="190" height="120" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <text class="ct" x="355" y="440" text-anchor="middle">Dropout</text>
    <text class="n" x="355" y="488" text-anchor="middle">p = 0.3</text>
  </g>
  <g>
    <rect x="490" y="400" width="190" height="120" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <text class="ct" x="585" y="440" text-anchor="middle">Linear</text>
    <text class="n" x="585" y="488" text-anchor="middle">512 &#8594; 2</text>
  </g>
  <g>
    <rect x="720" y="400" width="190" height="120" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <text class="ct" x="815" y="440" text-anchor="middle">Class scores</text>
    <text class="n" x="815" y="488" text-anchor="middle">[no_tumor, tumor]</text>
  </g>

  <path d="M 220 460 H 260" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>
  <path d="M 450 460 H 490" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>
  <path d="M 680 460 H 720" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>

  <!-- ============ the two tensors that leave the network ============ -->
  <path d="M 1047 240 V 348 H 120 V 400" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#a34)"/>
  <text class="n" x="560" y="330" text-anchor="middle">512 features</text>

  <path d="M 1100 240 V 620" stroke="#0f172a" stroke-width="2.6" fill="none" marker-end="url(#a34)"/>
  <text class="n" x="1088" y="430" text-anchor="end">feature map</text>
  <text class="n" x="1088" y="456" text-anchor="end">1 &#215; 512 &#215; 7 &#215; 7</text>

  <path d="M 585 520 V 590 H 850 V 620" stroke="#0f172a" stroke-width="2.6" fill="none" marker-end="url(#a34)"/>
  <text class="n" x="600" y="580">head weights 2 &#215; 512</text>

  <!-- ============ the explanation ============ -->
  <rect x="700" y="620" width="430" height="140" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2.4"/>
  <text class="ct" x="716" y="660">Class activation map</text>
  <text class="d" x="716" y="694">features &#215; head weights &#8594; ReLU</text>
  <text class="n" x="716" y="726">upsampled to 224 &#215; 224 and composited</text>

  <text class="n" x="20" y="820">The heatmap reuses the same forward pass: both tensors leave the network rather than being recomputed.</text>
</svg>
</section>
