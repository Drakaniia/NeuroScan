<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-labelledby="f33title f33desc">
  <title id="f33title">Context diagram (level zero) of NeuroScan</title>
  <desc id="f33desc">Two external entities, the user (researcher, health worker, or clinician) and the local file system, exchange data with NeuroScan as a single central process. The user supplies an image file or folder path and receives a verdict, confidence score, and heatmap; the file system supplies image files and receives the screening history, CSV summaries, and annotated PNG copies. A note states that no network entity exists at any level of the diagram, because acquisition reads local files only and inference reads the bundled model.</desc>

  <defs>
    <marker id="a33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <style>
      .t   { font: 700 24px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
      .d   { font: 400 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
      .n   { font: italic 400 21px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
      .lbl { font: 700 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
      .chip { font: 700 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
    </style>
  </defs>

  
  <!-- external entity: user -->
  <g>
    <rect x="40" y="265" width="180" height="150" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="t" x="130" y="318" text-anchor="middle">User</text>
    <text class="n" x="130" y="350" text-anchor="middle">screening</text>
    <text class="n" x="130" y="374" text-anchor="middle">operator</text>
  </g>

  <!-- external entity: local file system -->
  <g>
    <rect x="940" y="265" width="180" height="150" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="t" x="1030" y="310" text-anchor="middle">Local file</text>
    <text class="t" x="1030" y="338" text-anchor="middle">system</text>
    <text class="n" x="1030" y="368" text-anchor="middle">images in,</text>
    <text class="n" x="1030" y="392" text-anchor="middle">results out</text>
  </g>

  <!-- central process -->
  <g>
    <rect x="420" y="250" width="320" height="170" rx="14" fill="none" stroke="#000000" stroke-width="2.2"/>
    <circle cx="452" cy="282" r="17" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="chip" x="452" y="290" text-anchor="middle">0</text>
    <text class="t" x="580" y="322" text-anchor="middle">NeuroScan</text>
    <text class="d" x="580" y="352" text-anchor="middle">screening system</text>
    <text class="n" x="580" y="380" text-anchor="middle">all processing local</text>
  </g>

  <!-- user flows -->
  <path d="M 220 295 H 420" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a33)"/>
  <text class="n" x="320" y="282" text-anchor="middle">image or folder path</text>
  <path d="M 420 355 H 220" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a33)"/>
  <text class="n" x="320" y="382" text-anchor="middle">verdict, confidence</text>
  <text class="n" x="320" y="404" text-anchor="middle">and heatmap</text>

  <!-- file system flows -->
  <path d="M 940 295 H 740" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a33)"/>
  <text class="n" x="840" y="282" text-anchor="middle">image files</text>
  <path d="M 740 355 H 940" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a33)"/>
  <text class="n" x="840" y="382" text-anchor="middle">history, CSV,</text>
  <text class="n" x="840" y="404" text-anchor="middle">PNG copies</text>

  <!-- no-network note -->
  <g>
    <rect x="100" y="500" width="960" height="150" rx="12" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="9 6"/>
    <circle cx="148" cy="546" r="16" fill="none" stroke="#000000" stroke-width="2.2"/>
    <path d="M 137 557 L 159 535" stroke="#000000" stroke-width="2.2"/>
    <text class="lbl" x="184" y="556" fill="#000000">No network entity at any level</text>
    <text class="d" x="124" y="598">Acquisition reads local files only; inference reads the bundled model.</text>
    <text class="d" x="124" y="628">Results are written back to the local machine; nothing is transmitted.</text>
  </g>
</svg>
