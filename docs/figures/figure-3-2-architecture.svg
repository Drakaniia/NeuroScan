<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" width="1160" height="900" role="img" aria-labelledby="f35title f35desc">
  <title id="f35title">System architecture of NeuroScan</title>
  <desc id="f35desc">Above: the development-time offline Python pipeline, a chain of download and verify, deduplicate and split, train and evaluate, and export to ONNX. In the middle band, the exported artifacts form the interface between the two sides: the ONNX model exposing logits, feature map, head weights and head bias, together with the run configuration holding input size, normalization constants, class order and the screening threshold. Below: the run-time Tauri desktop application with a React and TypeScript frontend, the Rust command layer, the inference core using ONNX Runtime, the bundled resources, and the history and export store, with no network connection at run time.</desc>

  <defs>
    <marker id="a35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="a35b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <style>
      .ct  { font: 700 24px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
      .d   { font: 400 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
      .n   { font: italic 400 21px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
      .lbl { font: 700 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #000000; }
    </style>
  </defs>

  
  <!-- ============ development time ============ -->
  <rect x="20" y="70" width="1120" height="190" rx="14" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="11 8"/>
  <rect x="36" y="60" width="560" height="26" fill="none"/>
  <text class="lbl" x="38" y="78">Development time &#8212; Python pipeline</text>

  <g>
    <rect x="15" y="110" width="260" height="120" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="145" y="156" text-anchor="middle">Download and</text>
    <text class="ct" x="145" y="184" text-anchor="middle">verify</text>
    <text class="n" x="145" y="214" text-anchor="middle">byte size + zip</text>
  </g>
  <g>
    <rect x="305" y="110" width="260" height="120" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="435" y="156" text-anchor="middle">Deduplicate</text>
    <text class="ct" x="435" y="184" text-anchor="middle">and split</text>
    <text class="n" x="435" y="214" text-anchor="middle">content hash</text>
  </g>
  <g>
    <rect x="595" y="110" width="260" height="120" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="725" y="156" text-anchor="middle">Train and</text>
    <text class="ct" x="725" y="184" text-anchor="middle">evaluate</text>
    <text class="n" x="725" y="214" text-anchor="middle">local GPU + Colab</text>
  </g>
  <g>
    <rect x="885" y="110" width="260" height="120" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="1015" y="170" text-anchor="middle">Export to ONNX</text>
    <text class="n" x="1015" y="214" text-anchor="middle">model + config</text>
  </g>

  <path d="M 275 170 H 305" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>
  <path d="M 565 170 H 595" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>
  <path d="M 855 170 H 885" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>

  <!-- ============ the interface ============ -->
  <rect x="20" y="300" width="1120" height="130" rx="12" fill="none" stroke="#000000" stroke-width="2.4"/>
  <text class="lbl" x="40" y="336">Exported artifacts &#8212; the interface</text>
  <text class="d" x="40" y="374">neuroscan.onnx &#8212; logits, features, head_w, head_b</text>
  <text class="d" x="40" y="406">run-config.json &#8212; input size, normalization, class order, threshold &#964;</text>

  <path d="M 1015 230 V 300" stroke="#000000" stroke-width="2.6" fill="none" marker-end="url(#a35b)"/>
  <text class="n" x="1028" y="272">writes</text>

  <!-- ============ run time ============ -->
  <rect x="20" y="470" width="1120" height="360" rx="14" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="11 8"/>
  <rect x="36" y="458" width="600" height="30" fill="none"/>
  <text class="lbl" x="38" y="478">Run time &#8212; Tauri application (local)</text>

  <g>
    <rect x="30" y="520" width="230" height="200" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="145" y="556" text-anchor="middle">React +</text>
    <text class="ct" x="145" y="584" text-anchor="middle">TypeScript</text>
    <text class="d" x="46" y="620">screening view</text>
    <text class="d" x="46" y="648">batch progress</text>
    <text class="d" x="46" y="676">history view</text>
    <text class="d" x="46" y="704">disclaimer</text>
  </g>
  <g>
    <rect x="320" y="520" width="230" height="200" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="435" y="556" text-anchor="middle">Rust command</text>
    <text class="ct" x="435" y="584" text-anchor="middle">layer</text>
    <text class="d" x="336" y="620">classify_image</text>
    <text class="d" x="336" y="648">classify_batch</text>
    <text class="d" x="336" y="676">history save</text>
    <text class="d" x="336" y="704">export files</text>
  </g>
  <g>
    <rect x="610" y="520" width="230" height="200" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="725" y="556" text-anchor="middle">Inference</text>
    <text class="ct" x="725" y="584" text-anchor="middle">core (ort)</text>
    <text class="d" x="626" y="620">decode, resize</text>
    <text class="d" x="626" y="648">one ONNX pass</text>
    <text class="d" x="626" y="676">probability vs &#964;</text>
    <text class="d" x="626" y="704">CAM head_w</text>
  </g>
  <g>
    <rect x="900" y="520" width="230" height="200" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="1015" y="556" text-anchor="middle">Bundled</text>
    <text class="ct" x="1015" y="584" text-anchor="middle">resources</text>
    <text class="d" x="916" y="620">neuroscan.onnx</text>
    <text class="d" x="916" y="648">run-config.json</text>
    <text class="d" x="916" y="676">onnxruntime.dll</text>
    <text class="d" x="916" y="704">loaded at start</text>
  </g>

  <path d="M 260 570 H 320" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>
  <text class="n" x="290" y="560" text-anchor="middle">call</text>
  <path d="M 320 620 H 260" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>
  <text class="n" x="290" y="612" text-anchor="middle">events</text>
  <path d="M 550 570 H 610" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>
  <text class="n" x="580" y="560" text-anchor="middle">run</text>
  <path d="M 610 620 H 550" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>
  <text class="n" x="580" y="612" text-anchor="middle">result</text>
  <path d="M 900 570 H 840" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>
  <text class="n" x="870" y="560" text-anchor="middle">loads</text>

  <path d="M 715 430 V 520" stroke="#000000" stroke-width="2.6" fill="none" marker-end="url(#a35b)"/>
  <text class="n" x="728" y="460">read at startup</text>

  <g>
    <rect x="320" y="750" width="520" height="70" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
    <text class="ct" x="580" y="782" text-anchor="middle">History and exports</text>
    <text class="n" x="580" y="808" text-anchor="middle">history.json &#183; CSV summary &#183; annotated PNG copies</text>
  </g>
  <path d="M 435 720 V 750" stroke="#000000" stroke-width="2.4" fill="none" marker-end="url(#a35)"/>

  <text class="n" x="20" y="868">No network calls at run time: the model, the runtime and every image stay on the machine.</text>
</svg>
